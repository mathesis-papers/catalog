name: Display health and maintenance
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      verify_model:
        description: 'Also exercise the read-only NyxID model route when probes are healthy'
        type: boolean
        default: false
  workflow_run:
    workflows: ['Publish Mathesis papers']
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    uses: the-omega-institute/.github/.github/workflows/display-monitor.yml@00fe79fa38faac0e4d3b8f00f1bd933e4762c2c9
    with:
      monitor_revision: 00fe79fa38faac0e4d3b8f00f1bd933e4762c2c9
      verify_model: ${{ inputs.verify_model || false }}
      model_enabled: ${{ vars.DISPLAY_MONITOR_MODEL_ENABLED != 'false' }}
    secrets:
      model_key: ${{ secrets.NYXID_MONITOR_KEY }}
      github_key: ${{ secrets.NYXID_MONITOR_GITHUB_KEY }}
